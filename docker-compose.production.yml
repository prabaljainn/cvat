# CVAT Production Deployment with Custom Analytics & Angular Dashboard
# This file extends the base docker-compose.yml following CVAT documentation standards
# Usage: docker compose -f docker-compose.yml -f docker-compose.production.yml up -d

version: '3.8'

services:
  # Angular Dashboard Integration
  angular_dashboard:
    container_name: angular_dashboard
    image: ghcr.io/prabaljainn/orochi-ui:feature-hitesh
    restart: always
    environment:
      BOX: 'false'
      # Connect to CVAT API through internal network
      CVAT_API_URL: "http://cvat_server:8080/api"
      CVAT_HOST: "${CVAT_HOST:-localhost}"
    labels:
      traefik.enable: "true"
      traefik.http.services.angular-dashboard.loadbalancer.server.port: "80"
      # ---- Middlewares ----

      # (Optional) CORS (camelCase keys)
      traefik.http.middlewares.dashboard-cors.headers.accessControlAllowMethods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
      traefik.http.middlewares.dashboard-cors.headers.accessControlAllowHeaders: "Content-Type,Authorization,X-CSRFToken,X-Requested-With,Cookie"
      traefik.http.middlewares.dashboard-cors.headers.accessControlAllowCredentials: "true"
      traefik.http.middlewares.dashboard-cors.headers.accessControlMaxAge: "86400"
      traefik.http.middlewares.dashboard-cors.headers.accessControlAllowOriginList: "https://${CVAT_HOST:-localhost}"

      # Security headers to prevent mixed content and enforce HTTPS
      traefik.http.middlewares.dashboard-security.headers.contentSecurityPolicy: "upgrade-insecure-requests; default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https: blob:; connect-src 'self' https: wss:; font-src 'self' https:; object-src 'none'; media-src 'self' https:; frame-src 'self' https:;"
      traefik.http.middlewares.dashboard-security.headers.stsSeconds: "31536000"
      traefik.http.middlewares.dashboard-security.headers.stsIncludeSubdomains: "true"
      traefik.http.middlewares.dashboard-security.headers.stsPreload: "true"
      traefik.http.middlewares.dashboard-security.headers.forceSTSHeader: "true"
      traefik.http.middlewares.dashboard-security.headers.referrerPolicy: "strict-origin-when-cross-origin"
      traefik.http.middlewares.dashboard-security.headers.customRequestHeaders.X-Forwarded-Proto: "https"
      traefik.http.middlewares.dashboard-security.headers.customRequestHeaders.X-Forwarded-Port: "443"
      traefik.http.middlewares.dashboard-security.headers.customRequestHeaders.X-Forwarded-Ssl: "on"

      # Path-based routing for dashboard under CVAT_HOST
      # HTTP to HTTPS redirect for dashboard paths (excludes API paths for CVAT server)
      traefik.http.routers.angular-dashboard-http.rule: Host(`${CVAT_HOST:-localhost}`) && (PathPrefix(`/dashboard`) || (PathPrefix(`/en`) && !PathPrefix(`/api/`)) || (PathPrefix(`/ja`) && !PathPrefix(`/api/`)) || (PathPrefix(`/hi`) && !PathPrefix(`/api/`)) || (PathPrefix(`/ar`) && !PathPrefix(`/api/`)) || (PathPrefix(`/es`) && !PathPrefix(`/api/`)) || (PathPrefix(`/te`) && !PathPrefix(`/api/`)))
      traefik.http.routers.angular-dashboard-http.entrypoints: web
      traefik.http.routers.angular-dashboard-http.middlewares: "dashboard-https-redirect"
      traefik.http.routers.angular-dashboard-http.priority: "2000"

      # HTTPS redirect middleware
      traefik.http.middlewares.dashboard-https-redirect.redirectscheme.scheme: "https"
      traefik.http.middlewares.dashboard-https-redirect.redirectscheme.permanent: "true"

      # HTTPS routes for dashboard paths (excludes API paths for CVAT server)
      traefik.http.routers.angular-dashboard-https.rule: Host(`${CVAT_HOST:-localhost}`) && (PathPrefix(`/dashboard`) || (PathPrefix(`/en`) && !PathPrefix(`/api/`)) || (PathPrefix(`/ja`) && !PathPrefix(`/api/`)) || (PathPrefix(`/hi`) && !PathPrefix(`/api/`)) || (PathPrefix(`/ar`) && !PathPrefix(`/api/`)) || (PathPrefix(`/es`) && !PathPrefix(`/api/`)) || (PathPrefix(`/te`) && !PathPrefix(`/api/`)))
      traefik.http.routers.angular-dashboard-https.entrypoints: websecure
      traefik.http.routers.angular-dashboard-https.tls: "true"
      traefik.http.routers.angular-dashboard-https.tls.certresolver: lets-encrypt
      traefik.http.routers.angular-dashboard-https.middlewares: "dashboard-cors,dashboard-security,ip-allowlist@file"
      traefik.http.routers.angular-dashboard-https.priority: "2000"
    networks:
      - cvat
    depends_on:
      - cvat_server
    # Add resource limits to prevent OOM kills
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    # Health check disabled temporarily - application is working
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "-s", "-o", "/dev/null", "http://localhost:80/en/", "||", "exit", "1"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 40s

  # CVAT Server with Custom Analytics - Build your custom image
  cvat_server:
    labels:
      traefik.http.routers.cvat.middlewares: "ip-allowlist@file"
    image: prabaljainn/cvat-server:latest
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    #   args:
    #     http_proxy: ${http_proxy:-}
    #     https_proxy: ${https_proxy:-}
    #     socks_proxy: ${socks_proxy:-}
    #     CLAM_AV: ${CLAM_AV:-no}
    environment:
      # Custom analytics features
      CVAT_ANALYTICS_ENABLED: "true"
      CVAT_CUSTOM_FEATURES_ENABLED: "true"
      # CORS for dashboard integration
      CORS_ORIGIN_WHITELIST: |
        http://${CVAT_HOST:-localhost},
        https://${CVAT_HOST:-localhost},
        http://*.${CVAT_HOST:-localhost},
        https://*.${CVAT_HOST:-localhost}
      CORS_ALLOW_CREDENTIALS: "true"
      # CSRF settings for dashboard
      CSRF_TRUSTED_ORIGINS: "https://${CVAT_HOST:-localhost},http://${CVAT_HOST:-localhost}"
      CSRF_COOKIE_SAMESITE: "Lax"
      CSRF_COOKIE_HTTPONLY: "False"
      SESSION_COOKIE_SAMESITE: "Lax"
      SESSION_COOKIE_HTTPONLY: "False"
      # S3 configuration for video streaming
      CVAT_S3_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      CVAT_S3_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      CVAT_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME}
      CVAT_S3_REGION: ${AWS_S3_REGION}

  # CVAT UI with Custom Train Metadata Component
  cvat_ui:
    labels:
      traefik.http.routers.cvat-ui.middlewares: "ip-allowlist@file"
    image: prabaljainn/cvat-ui:latest
    # build:
    #   context: .
    #   dockerfile: Dockerfile.ui
    #   args:
    #     http_proxy: ${http_proxy:-}
    #     https_proxy: ${https_proxy:-}
    #     socks_proxy: ${socks_proxy:-}
    # # Override the default image to use your built UI
    # image: cvat/ui:custom-train-metadata

  # All workers use your custom build too
  cvat_worker_import:
    image: prabaljainn/cvat-server:latest
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    #   args:
    #     http_proxy: ${http_proxy:-}
    #     https_proxy: ${https_proxy:-}
    #     socks_proxy: ${socks_proxy:-}
    #     CLAM_AV: ${CLAM_AV:-no}
    environment:
      CVAT_ANALYTICS_ENABLED: "true"
      CVAT_CUSTOM_FEATURES_ENABLED: "true"

  cvat_worker_export:
    image: prabaljainn/cvat-server:latest
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    #   args:
    #     http_proxy: ${http_proxy:-}
    #     https_proxy: ${https_proxy:-}
    #     socks_proxy: ${socks_proxy:-}
    #     CLAM_AV: ${CLAM_AV:-no}
    environment:
      CVAT_ANALYTICS_ENABLED: "true"
      CVAT_CUSTOM_FEATURES_ENABLED: "true"

  cvat_worker_annotation:
    image: prabaljainn/cvat-server:latest
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    #   args:
    #     http_proxy: ${http_proxy:-}
    #     https_proxy: ${https_proxy:-}
    #     socks_proxy: ${socks_proxy:-}
    #     CLAM_AV: ${CLAM_AV:-no}
    environment:
      CVAT_ANALYTICS_ENABLED: "true"
      CVAT_CUSTOM_FEATURES_ENABLED: "true"

  cvat_worker_chunks:
    image: prabaljainn/cvat-server:latest
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    #   args:
    #     http_proxy: ${http_proxy:-}
    #     https_proxy: ${https_proxy:-}
    #     socks_proxy: ${socks_proxy:-}
    #     CLAM_AV: ${CLAM_AV:-no}
    environment:
      CVAT_ANALYTICS_ENABLED: "true"
      CVAT_CUSTOM_FEATURES_ENABLED: "true"

  # Traefik: mount the rules file (IP allowlist + edge proxy) into the file provider directory
  traefik:
    environment:
      EDGE_SERVER_URL: ${EDGE_SERVER_URL:-http://tkr-edge:8000}
    volumes:
      - ./components/analytics/traefik_rules.yml:/etc/traefik/rules/traefik_rules.yml:ro

  # Override problematic KVRocks with regular Redis
  cvat_redis_ondisk:
    image: redis:7.2.3-alpine
    restart: always
    command: [
      "redis-server",
      "--port", "6666",
      "--save", "900", "1",
      "--save", "300", "10",
      "--save", "60", "10000",
      "--appendonly", "yes",
      "--dir", "/data"
    ]
    volumes:
      - cvat_cache_db:/data
    networks:
      - cvat
