# CVAT Production Deployment with Custom Analytics & Angular Dashboard
# This file extends the base docker-compose.yml following CVAT documentation standards
# Usage: docker compose -f docker-compose.yml -f docker-compose.production.yml up -d

version: '3.8'

services:
  # Angular Dashboard Integration
  angular_dashboard:
    container_name: angular_dashboard
    image: ghcr.io/prabaljainn/orochi-ui:latest
    restart: always
    environment:
      BOX: 'false'
      # Connect to CVAT API through internal network
      CVAT_API_URL: "http://cvat_server:8080/api"
      CVAT_HOST: "${CVAT_HOST:-localhost}"
    labels:
      traefik.enable: "true"
      traefik.http.services.angular-dashboard.loadbalancer.server.port: "80"
      # Dashboard routing
      traefik.http.routers.angular-dashboard.rule: Host(`${CVAT_HOST:-localhost}`) && (PathPrefix(`/dashboard`) || PathPrefix(`/en/`) || PathPrefix(`/ar/`) || PathPrefix(`/ja/`))
      traefik.http.routers.angular-dashboard.entrypoints: web
      # HTTPS routing
      traefik.http.routers.angular-dashboard-https.rule: Host(`${CVAT_HOST:-localhost}`) && (PathPrefix(`/dashboard`) || PathPrefix(`/en/`) || PathPrefix(`/ar/`) || PathPrefix(`/ja/`))
      traefik.http.routers.angular-dashboard-https.entrypoints: websecure
      traefik.http.routers.angular-dashboard-https.tls.certresolver: lets-encrypt
      # CORS middleware for API access from dashboard
      traefik.http.middlewares.dashboard-cors.headers.accesscontrolallowmethods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
      traefik.http.middlewares.dashboard-cors.headers.accesscontrolallowheaders: "Content-Type,Authorization,X-CSRFToken,X-Requested-With,Cookie"
      traefik.http.middlewares.dashboard-cors.headers.accesscontrolalloworigin: "https://${CVAT_HOST:-localhost}"
      traefik.http.middlewares.dashboard-cors.headers.accesscontrolallowcredentials: "true"
      traefik.http.middlewares.dashboard-cors.headers.accesscontrolmaxage: "86400"
      traefik.http.routers.angular-dashboard.middlewares: "dashboard-cors"
      traefik.http.routers.angular-dashboard-https.middlewares: "dashboard-cors"
    networks:
      - cvat
    depends_on:
      - cvat_server

  # CVAT Server with Custom Analytics - Build your custom image
  cvat_server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        socks_proxy: ${socks_proxy:-}
        CLAM_AV: ${CLAM_AV:-no}
    environment:
      # Custom analytics features
      CVAT_ANALYTICS_ENABLED: "true"
      CVAT_CUSTOM_FEATURES_ENABLED: "true"
      # CORS for dashboard integration
      CORS_ORIGIN_WHITELIST: "http://${CVAT_HOST:-localhost},https://${CVAT_HOST:-localhost}"
      CORS_ALLOW_CREDENTIALS: "true"
      # CSRF settings for dashboard
      # CSRF_TRUSTED_ORIGINS: "https://${CVAT_HOST:-localhost},http://${CVAT_HOST:-localhost}"
      # CSRF_COOKIE_SAMESITE: "Lax"
      # CSRF_COOKIE_HTTPONLY: "False"
      # SESSION_COOKIE_SAMESITE: "Lax"
      # SESSION_COOKIE_HTTPONLY: "False"

  # All workers use your custom build too
  cvat_worker_import:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        socks_proxy: ${socks_proxy:-}
        CLAM_AV: ${CLAM_AV:-no}
    environment:
      CVAT_ANALYTICS_ENABLED: "true"
      CVAT_CUSTOM_FEATURES_ENABLED: "true"

  cvat_worker_export:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        socks_proxy: ${socks_proxy:-}
        CLAM_AV: ${CLAM_AV:-no}
    environment:
      CVAT_ANALYTICS_ENABLED: "true"
      CVAT_CUSTOM_FEATURES_ENABLED: "true"

  cvat_worker_annotation:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        socks_proxy: ${socks_proxy:-}
        CLAM_AV: ${CLAM_AV:-no}
    environment:
      CVAT_ANALYTICS_ENABLED: "true"
      CVAT_CUSTOM_FEATURES_ENABLED: "true"

  cvat_worker_chunks:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        socks_proxy: ${socks_proxy:-}
        CLAM_AV: ${CLAM_AV:-no}
    environment:
      CVAT_ANALYTICS_ENABLED: "true"
      CVAT_CUSTOM_FEATURES_ENABLED: "true"

  # Override problematic KVRocks with regular Redis
  cvat_redis_ondisk:
    image: redis:7.2.3-alpine
    restart: always
    command: [
      "redis-server",
      "--port", "6666",
      "--save", "900", "1",
      "--save", "300", "10",
      "--save", "60", "10000",
      "--appendonly", "yes",
      "--dir", "/data"
    ]
    volumes:
      - cvat_cache_db:/data
    networks:
      - cvat
