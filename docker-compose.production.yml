# CVAT Production Deployment with Custom Analytics & Angular Dashboard
# This file extends the base docker-compose.yml following CVAT documentation standards
# Usage: docker compose -f docker-compose.yml -f docker-compose.production.yml up -d

version: '3.8'

services:
  # Angular Dashboard Integration
  angular_dashboard:
    container_name: angular_dashboard
    image: ghcr.io/prabaljainn/orochi-ui:latest
    restart: always
    environment:
      BOX: 'false'
      # Connect to CVAT API through internal network
      CVAT_API_URL: "http://cvat_server:8080/api"
      CVAT_HOST: "${CVAT_HOST:-localhost}"
      DASHBOARD_HOST: "${DASHBOARD_HOST:-localhost}"
      # Force HTTPS for external URLs
      FORCE_HTTPS: "true"
      # Ensure Angular uses HTTPS for all external requests
      API_BASE_URL: "https://${DASHBOARD_HOST:-localhost}"
      BASE_HREF: "/"
      HTTPS_ONLY: "true"
      # Force protocol detection
      HTTPS: "true"
      NODE_ENV: "production"
      PROTOCOL: "https"
    labels:
      traefik.enable: "true"
      traefik.http.services.angular-dashboard.loadbalancer.server.port: "80"
      # ---- Middlewares ----
      # Strip /dashboard so Angular can keep base href="/"
#      traefik.http.middlewares.dashboard-strip-prefix.stripprefix.prefixes: "${DASHBOARD_PREFIX}"

      # (Optional) CORS (camelCase keys)
      traefik.http.middlewares.dashboard-cors.headers.accessControlAllowMethods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
      traefik.http.middlewares.dashboard-cors.headers.accessControlAllowHeaders: "Content-Type,Authorization,X-CSRFToken,X-Requested-With,Cookie"
      traefik.http.middlewares.dashboard-cors.headers.accessControlAllowCredentials: "true"
      traefik.http.middlewares.dashboard-cors.headers.accessControlMaxAge: "86400"
      traefik.http.middlewares.dashboard-cors.headers.accessControlAllowOriginList: "https://${CVAT_HOST:-localhost},https://${DASHBOARD_HOST:-${CVAT_HOST:-localhost}}"

      # Security headers to prevent mixed content and enforce HTTPS
      traefik.http.middlewares.dashboard-security.headers.contentSecurityPolicy: "upgrade-insecure-requests; default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; connect-src 'self' https: wss:; font-src 'self' https:; object-src 'none'; media-src 'self' https:; frame-src 'self' https:;"
      traefik.http.middlewares.dashboard-security.headers.strictTransportSecurity: "max-age=31536000; includeSubDomains; preload"
      traefik.http.middlewares.dashboard-security.headers.forceSTSHeader: "true"
      traefik.http.middlewares.dashboard-security.headers.referrerPolicy: "strict-origin-when-cross-origin"
      traefik.http.middlewares.dashboard-security.headers.customRequestHeaders.X-Forwarded-Proto: "https"
      traefik.http.middlewares.dashboard-security.headers.customRequestHeaders.X-Forwarded-Port: "443"
      traefik.http.middlewares.dashboard-security.headers.customRequestHeaders.X-Forwarded-Ssl: "on"

      # ---- Router A: CVAT_HOST under /dashboard (fallback option) ----
      traefik.http.routers.angular-dashboard.rule: >
        Host(`${CVAT_HOST:-localhost}`) &&
        (PathPrefix(`${DASHBOARD_PREFIX:-/dashboard}`) || PathPrefix(`${DASHBOARD_PREFIX:-/dashboard}/en/`) ||
         PathPrefix(`${DASHBOARD_PREFIX:-/dashboard}/ar/`) || PathPrefix(`${DASHBOARD_PREFIX:-/dashboard}/ja/`))
      traefik.http.routers.angular-dashboard.entrypoints: web
      traefik.http.routers.angular-dashboard.middlewares: "dashboard-https-redirect"
      traefik.http.routers.angular-dashboard.priority: "1100"

      traefik.http.routers.angular-dashboard-https.rule: >
        Host(`${CVAT_HOST:-localhost}`) &&
        (PathPrefix(`${DASHBOARD_PREFIX:-/dashboard}`) || PathPrefix(`${DASHBOARD_PREFIX:-/dashboard}/en/`) ||
         PathPrefix(`${DASHBOARD_PREFIX:-/dashboard}/ar/`) || PathPrefix(`${DASHBOARD_PREFIX:-/dashboard}/ja/`))
      traefik.http.routers.angular-dashboard-https.entrypoints: websecure
      traefik.http.routers.angular-dashboard-https.tls.certresolver: lets-encrypt
      traefik.http.routers.angular-dashboard-https.middlewares: "dashboard-cors,dashboard-security,dashboard-strip-prefix"
      traefik.http.routers.angular-dashboard-https.priority: "1100"

      # Strip prefix middleware
      traefik.http.middlewares.dashboard-strip-prefix.stripprefix.prefixes: "${DASHBOARD_PREFIX:-/dashboard}"

      # ---- Router B: Dedicated DASHBOARD_HOST at site root ----
      # HTTP to HTTPS redirect for DASHBOARD_HOST
      traefik.http.routers.angular-dashboard-direct.rule: Host(`${DASHBOARD_HOST:-${CVAT_HOST:-localhost}}`)
      traefik.http.routers.angular-dashboard-direct.entrypoints: web
      traefik.http.routers.angular-dashboard-direct.middlewares: "dashboard-https-redirect"
      traefik.http.routers.angular-dashboard-direct.priority: "1000"

      # HTTPS redirect middleware for DASHBOARD_HOST
      traefik.http.middlewares.dashboard-https-redirect.redirectscheme.scheme: "https"
      traefik.http.middlewares.dashboard-https-redirect.redirectscheme.permanent: "true"

      traefik.http.routers.angular-dashboard-direct-https.rule: Host(`${DASHBOARD_HOST:-${CVAT_HOST:-localhost}}`)
      traefik.http.routers.angular-dashboard-direct-https.entrypoints: websecure
      traefik.http.routers.angular-dashboard-direct-https.tls: "true"
      traefik.http.routers.angular-dashboard-direct-https.tls.certresolver: lets-encrypt
      traefik.http.routers.angular-dashboard-direct-https.middlewares: "dashboard-cors,dashboard-security"
      traefik.http.routers.angular-dashboard-direct-https.priority: "1000"

      # Debug: Also match dashboard.sudocodes.com explicitly for troubleshooting
      traefik.http.routers.angular-dashboard-debug.rule: Host(`dashboard.sudocodes.com`)
      traefik.http.routers.angular-dashboard-debug.entrypoints: websecure
      traefik.http.routers.angular-dashboard-debug.tls: "true"
      traefik.http.routers.angular-dashboard-debug.tls.certresolver: lets-encrypt
      traefik.http.routers.angular-dashboard-debug.middlewares: "dashboard-cors,dashboard-security"
      traefik.http.routers.angular-dashboard-debug.priority: "999"


    networks:
      - cvat
    depends_on:
      - cvat_server

  # CVAT Server with Custom Analytics - Build your custom image
  cvat_server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        socks_proxy: ${socks_proxy:-}
        CLAM_AV: ${CLAM_AV:-no}
    environment:
      # Custom analytics features
      CVAT_ANALYTICS_ENABLED: "true"
      CVAT_CUSTOM_FEATURES_ENABLED: "true"
      # CORS for dashboard integration
      CORS_ORIGIN_WHITELIST: |
        http://${CVAT_HOST:-localhost},
        https://${CVAT_HOST:-localhost},
        http://*.${CVAT_HOST:-localhost},
        https://*.${CVAT_HOST:-localhost},
        http://${DASHBOARD_HOST:-localhost},
        https://${DASHBOARD_HOST:-localhost},
        http://*.${DASHBOARD_HOST:-localhost},
        https://*.${DASHBOARD_HOST:-localhost}
      CORS_ALLOW_CREDENTIALS: "true"
      # CSRF settings for dashboard
      CSRF_TRUSTED_ORIGINS: "https://${CVAT_HOST:-localhost},http://${CVAT_HOST:-localhost},https://${DASHBOARD_HOST:-localhost},http://${DASHBOARD_HOST:-localhost}"
      CSRF_COOKIE_SAMESITE: "Lax"
      CSRF_COOKIE_HTTPONLY: "False"
      SESSION_COOKIE_SAMESITE: "Lax"
      SESSION_COOKIE_HTTPONLY: "False"

  # CVAT UI with Custom Train Metadata Component
  cvat_ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
      args:
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        socks_proxy: ${socks_proxy:-}
    # Override the default image to use your built UI
    image: cvat/ui:custom-train-metadata

  # All workers use your custom build too
  cvat_worker_import:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        socks_proxy: ${socks_proxy:-}
        CLAM_AV: ${CLAM_AV:-no}
    environment:
      CVAT_ANALYTICS_ENABLED: "true"
      CVAT_CUSTOM_FEATURES_ENABLED: "true"

  cvat_worker_export:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        socks_proxy: ${socks_proxy:-}
        CLAM_AV: ${CLAM_AV:-no}
    environment:
      CVAT_ANALYTICS_ENABLED: "true"
      CVAT_CUSTOM_FEATURES_ENABLED: "true"

  cvat_worker_annotation:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        socks_proxy: ${socks_proxy:-}
        CLAM_AV: ${CLAM_AV:-no}
    environment:
      CVAT_ANALYTICS_ENABLED: "true"
      CVAT_CUSTOM_FEATURES_ENABLED: "true"

  cvat_worker_chunks:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        socks_proxy: ${socks_proxy:-}
        CLAM_AV: ${CLAM_AV:-no}
    environment:
      CVAT_ANALYTICS_ENABLED: "true"
      CVAT_CUSTOM_FEATURES_ENABLED: "true"

  # Override problematic KVRocks with regular Redis
  cvat_redis_ondisk:
    image: redis:7.2.3-alpine
    restart: always
    command: [
      "redis-server",
      "--port", "6666",
      "--save", "900", "1",
      "--save", "300", "10",
      "--save", "60", "10000",
      "--appendonly", "yes",
      "--dir", "/data"
    ]
    volumes:
      - cvat_cache_db:/data
    networks:
      - cvat
